name: taskboard

services:
  frontend:
    image: taskboard-frontend:1.0
    build:
      context: ./frontend
    ports:
      - "${FRONT_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - front-net
    restart: unless-stopped

  backend:
    image: taskboard-backend:1.0
    build:
      context: ./backend
      args:
        APP_VERSION: "1.0"
    environment:
      DB_HOST: db
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - front-net
      - back-net
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - back-net
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - back-net
    restart: unless-stopped

networks:
  front-net:
  back-net:

volumes:
  db-data:
  redis-data:
