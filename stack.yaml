version: "3.9"

services:
  frontend:
    image: ${DOCKERHUB_USER}/taskboard-frontend:1.0
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
    networks:
      - front-net
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first

  backend:
    image: ${DOCKERHUB_USER}/taskboard-backend:1.0
    environment:
      DB_HOST: db
      DB_NAME: taskboard
      DB_USER: taskboard
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_HOST: redis
    secrets:
      - db_password
    networks:
      - front-net
      - back-net
    deploy:
      replicas: 4
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        monitor: 30s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: taskboard
      MYSQL_USER: taskboard
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_root_password
      - db_password
    configs:
      - source: db_init
        target: /docker-entrypoint-initdb.d/init.sql
        mode: 0444
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$(cat /run/secrets/db_root_password)" --silent
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - back-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == db

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - back-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == db

networks:
  front-net:
    driver: overlay
  back-net:
    driver: overlay

volumes:
  db-data:
  redis-data:

secrets:
  db_root_password:
    external: true
  db_password:
    external: true

configs:
  db_init:
    file: ./db/init.sql
